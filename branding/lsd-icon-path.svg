<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>

    <!-- Background: deep ink-blue → warm dark teal -->
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#111827"/>
      <stop offset="100%" stop-color="#0E4D5C"/>
    </linearGradient>

    <!-- Warm radial bloom behind the ligature -->
    <radialGradient id="bloom" cx="50%" cy="48%" r="42%">
      <stop offset="0%"   stop-color="#C8914A" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#C8914A" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow filter for amber shadow pass -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clipping mask: iOS rounded-square -->
    <clipPath id="shape">
      <rect width="512" height="512" rx="114"/>
    </clipPath>

    <!--
      چھے  ligature — FatemiMaqala-Regular glyph "chhe.liga"
      Extracted from /fatemimaqala/FatemiMaqala-Regular.ttf via fontTools.
      Font units: 2048 UPM, glyph bounds x=1..1775 y=-622..1165.
      Transform maps font coords → 512×512 canvas:
        scale(0.1807, -0.1807)  — uniform scale + y-flip (font y-up → SVG y-down)
        translate(95.49, 305.07) — centres the scaled glyph in the canvas
    -->

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>

    <!-- Background: dark navy → deep teal, diagonal -->
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#1B3660"/>
      <stop offset="100%" stop-color="#0C6E80"/>
    </linearGradient>

    <!-- Soft inner vignette to give depth -->
    <radialGradient id="vignette" cx="50%" cy="45%" r="60%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.18"/>
    </radialGradient>

    <!-- Clipping mask for rounded-square iOS icon shape -->
    <clipPath id="icon-shape">
      <rect width="512" height="512" rx="114"/>
    </clipPath>

  </defs>

  <g clip-path="url(#icon-shape)">

    <!-- Background fill -->
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#vignette)"/>

    <!-- ════════════════════════════════════════════
         Keyboard key row — decorative, bottom third
         Six small keys + a wide space bar
         ════════════════════════════════════════════ -->

    <!-- Top key row -->
    <rect x="52"  y="388" width="54" height="36" rx="8" fill="white" fill-opacity="0.11"/>
    <rect x="118" y="388" width="54" height="36" rx="8" fill="white" fill-opacity="0.11"/>
    <rect x="184" y="388" width="54" height="36" rx="8" fill="white" fill-opacity="0.11"/>
    <rect x="250" y="388" width="54" height="36" rx="8" fill="white" fill-opacity="0.11"/>
    <rect x="316" y="388" width="54" height="36" rx="8" fill="white" fill-opacity="0.11"/>
    <rect x="382" y="388" width="78" height="36" rx="8" fill="white" fill-opacity="0.14"/>

    <!-- Bottom row: two utility keys + wide space bar -->
    <rect x="52"  y="436" width="74"  height="36" rx="8" fill="white" fill-opacity="0.10"/>
    <rect x="138" y="436" width="236" height="36" rx="8" fill="white" fill-opacity="0.20"/>
    <rect x="386" y="436" width="74"  height="36" rx="8" fill="white" fill-opacity="0.10"/>

    <!-- ════════════════════════════════════════════
         Main letterform — Arabic ل (lam)
         Drawn as a path so no font dependency.

         Anatomy of isolated ل:
           • Tall right-side vertical stroke (the "alif" part)
           • Curves left and down at the base
           • Ends with a small leftward foot
         ════════════════════════════════════════════ -->

    <!-- Outer glow / shadow for the letter -->
    <path d="M 295 82
             C 295 82 295 82 293 84
             L 278 290
             C 276 318 268 338 250 352
             C 234 365 212 368 194 362
             C 172 354 163 336 166 318
             L 168 306"
          fill="none"
          stroke="#0C6E80"
          stroke-width="56"
          stroke-linecap="round"
          stroke-linejoin="round"
          opacity="0.5"/>

    <!-- Main letter stroke — warm white with slight cream tint -->
    <path d="M 295 82
             C 295 82 295 82 293 84
             L 278 290
             C 276 318 268 338 250 352
             C 234 365 212 368 194 362
             C 172 354 163 336 166 318
             L 168 306"
          fill="none"
          stroke="#F7F1E6"
          stroke-width="34"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- ════════════════════════════════════════════
         Accent: warm amber dot — a nod to
         diacritical marks in Arabic script
         ════════════════════════════════════════════ -->
    <circle cx="310" cy="200" r="16" fill="#F5C033" opacity="0.92"/>

    <!-- Tiny second dot (like double diacritic) for visual balance -->
    <circle cx="310" cy="158" r="9"  fill="#F5C033" opacity="0.55"/>

  </g>

</svg>
